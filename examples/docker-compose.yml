services:
  rensaio:
    container_name: rensaio
    image: 'maxpiva/rensaio:latest'
    volumes:
      - '/path/to/your/series:/series'
      - '/path/to/your/config:/config'
    environment:
      - UMASK=022
      - PGID=100
      - PUID=99
    ports:
      - '9833:9833'
    # Optional but recommended: cap the container. The .NET GC reads the cgroup limit
    # and keeps its heap under 75% of it, so this bounds memory instead of just killing
    # the process. Raise it for very large libraries.
    mem_limit: 4g
